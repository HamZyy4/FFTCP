
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "app.py"
      - "main.py"
      - "teexez/**"
      - "buildozer.spec"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip build-essential ccache \
            libffi-dev libssl-dev zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libtool autoconf automake pkg-config \
            libltdl-dev libsqlite3-dev
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36
      - name: Build debug APK
        run: buildozer -v android debug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: teexez-tcp-bot-debug-apk
          path: bin/*.apk
          if-no-files-found: error
